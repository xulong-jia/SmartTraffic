services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      SMARTTRAFFIC_DATABASE_URL: sqlite:////app/results/smarttraffic.db
      SMARTTRAFFIC_RESULTS_DIR: /app/results/traffic_analysis
      SMARTTRAFFIC_LOCAL_VIDEOS_DIR: /app/local_videos
      SMARTTRAFFIC_LOCAL_MODELS_DIR: /app/local_models
      SMARTTRAFFIC_EVALS_DIR: /app/evals
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-/app/local_models/yolov8n.pt}
    ports:
      - "8000:8000"
    volumes:
      - ./local_videos:/app/local_videos
      - ./local_models:/app/local_models
      - ./results:/app/results
      - ./evals:/app/evals
      - ./samples:/app/samples:ro
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
